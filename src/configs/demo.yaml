# ==============================
# PROJECT METADATA
# ==============================
project:
  name: customer_churn_prediction
  owner: data_science_team
  environment: production
  description: Predict customer churn for telecom users

# ==============================
# DATA CONFIGURATION
# ==============================
data:
  dataset_name: telecom_churn_v1
  source:
    type: csv
    path: data/telecom_churn.csv

  target:
    column: churn
    positive_class: "Yes"

  id_column: customer_id

# ==============================
# EXPERIMENT CONTEXT
# (This links experimentation → MLOps)
# ==============================
experiment:
  objective: reduce_false_negatives
  baseline_run_id: "mlflow_run_1234"
  promoted_from_experiment: true
  notes: >
    Feature logic stabilized after 27 experiments.
    Decisions based on AUC + recall tradeoff.

# ==============================
# PREPROCESSING (FROZEN LEARNINGS)
# ==============================
preprocessing:

  missing_values:
    numeric:
      strategy: median
    categorical:
      strategy: constant
      fill_value: "__MISSING__"

  categorical_cleaning:

    # Learned during experimentation
    payment_method:
      replacements:
        "Electronic check": "Electronic"
        "E-check": "Electronic"

    contract:
      allowed_values:
        - Month-to-month
        - One year
        - Two year
      unknown_value: "__OTHER__"

# ==============================
# FEATURE ENGINEERING
# ==============================
features:

  # Raw numerical features
  numeric:
    - tenure
    - monthly_charges
    - total_charges

  # Raw categorical features
  categorical:
    - contract
    - payment_method
    - internet_service

  # Derived features (born from experimentation)
  derived:

    is_monthly_contract:
      type: boolean
      source: contract
      rule:
        equals: "Month-to-month"

    high_monthly_charges:
      type: boolean
      source: monthly_charges
      rule:
        greater_than: 80

# ==============================
# FEATURE ENCODING
# ==============================
encoding:

  categorical:
    method: one_hot
    handle_unknown: ignore
    min_frequency: 0.01

  boolean:
    method: binary

  numeric:
    scaling: standard

# ==============================
# TRAIN / VALIDATION SPLIT
# ==============================
splitting:
  method: stratified
  test_size: 0.2
  random_state: 42

# ==============================
# MODEL CONFIGURATION
# ==============================
model:
  type: xgboost
  version: v3

  hyperparameters:
    max_depth: 5
    learning_rate: 0.05
    n_estimators: 300
    subsample: 0.8
    colsample_bytree: 0.8

# ==============================
# TRAINING STRATEGY
# ==============================
training:
  objective: binary:logistic
  early_stopping_rounds: 30
  eval_metric:
    - auc
    - recall

# ==============================
# EVALUATION & ACCEPTANCE
# ==============================
evaluation:

  primary_metric: auc
  secondary_metrics:
    - recall
    - precision
    - f1

  acceptance_criteria:
    auc_min: 0.80
    recall_min: 0.65

# ==============================
# PRODUCTION MONITORING
# ==============================
monitoring:

  data_drift:
    enabled: true
    method: psi
    threshold: 0.2

  prediction_drift:
    enabled: true
    threshold: 0.15

  performance_tracking:
    enabled: true
    evaluation_window_days: 30

# ==============================
# MLFLOW INTEGRATION
# ==============================
mlflow:

  experiment_name: churn_prediction_experiments
  track_params: true
  track_metrics: true
  track_artifacts:
    - feature_config
    - preprocessing_objects
    - model

  tags:
    project: churn
    stage: production
    owner: data_science_team

# ==============================
# VERSIONING & GOVERNANCE
# ==============================
versioning:
  config_version: v1.0.0
  previous_version: null
  change_reason: >
    First stable version after experimentation phase.
    Payment method normalization and contract features locked.

approval:
  approved_by: lead_data_scientist
  approved_on: "2026-02-10"
