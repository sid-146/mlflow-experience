name: Publish to PyPI

on:
    release:
        types: [published]
    workflow_dispatch:
        inputs:
            target:
                description: "Target repository to upload to"
                required: true
                type: choice
                default: "pypi"
                options:
                    - pypi
                    - testpypi

jobs:
    build:
        name: Build distribution packages
        runs-on: ubuntu-latest
        steps:
            - name: Checkout code
              uses: actions/checkout@v4

            - name: Install uv
              uses: astral-sh/setup-uv@v5
              with:
                  version: "latest"
                  enable-cache: true

            - name: Set up Python 3.12
              uses: actions/setup-python@v5
              with:
                  python-version: "3.12"

            - name: Install dependencies
              run: |
                  uv sync --group dev

            - name: Run tests prior to building
              run: |
                  uv run pytest

            - name: Build sdist and wheel
              run: |
                  uv build

            - name: Store distribution artifacts
              uses: actions/upload-artifact@v4
              with:
                  name: python-package-distributions
                  path: dist/

    publish-to-pypi:
        name: Publish Python distribution to PyPI
        needs: build
        runs-on: ubuntu-latest
        if: (github.event_name == 'release' && github.event.action == 'published') || (github.event_name == 'workflow_dispatch' && github.event.inputs.target == 'pypi')
        environment:
            name: pypi
            url: https://pypi.org/p/folioman-client
        permissions:
            id-token: write # Mandatory for PyPI Trusted Publishing (OIDC)

        steps:
            - name: Download distribution artifacts
              uses: actions/download-artifact@v4
              with:
                  name: python-package-distributions
                  path: dist/

            - name: Publish to PyPI
              uses: pypa/gh-action-pypi-publish@release/v1

    publish-to-testpypi:
        name: Publish Python distribution to TestPyPI
        needs: build
        runs-on: ubuntu-latest
        if: github.event_name == 'workflow_dispatch' && github.event.inputs.target == 'testpypi'
        environment:
            name: testpypi
            url: https://test.pypi.org/p/folioman-client
        permissions:
            id-token: write # Mandatory for TestPyPI Trusted Publishing (OIDC)

        steps:
            - name: Download distribution artifacts
              uses: actions/download-artifact@v4
              with:
                  name: python-package-distributions
                  path: dist/

            - name: Publish to TestPyPI
              uses: pypa/gh-action-pypi-publish@release/v1
              with:
                  repository-url: https://test.pypi.org/legacy/
