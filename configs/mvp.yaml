project:
  name: customer_churn_prediction
  owner: data_science_team
  environment: production
  description: Predict customer churn for telecom users

mlflow:
  experiment_name: customer_churn_experiments
  experiment_id: NA
  track_params: true
  track_metrics: true
  track_artifacts:
    - feature_config
    - preprocessing_objects
    - model

  tags:
    project: churn
    stage: production
    owner: data_science_team


dataset:
  dataset_name: telecom_churn_v1
  random_state: 52
  # test_size: .3
  
  # todo: Add train test split ratio in future if test dataset is not provided.
  train:
    type: csv
    path: data/raw/churn_train.csv
    id_column: CustomerID
    target_column: Churn
    positive_class: 1

  # test:
  #   type: csv
  #   path: data/raw/churn_test.csv
  #   id_column: CustomerID
  #   target_column: Churn
  #   positive_class: 1


preprocessing:
  # 1. Rename (Schema normalization)
  - name: rename_columns
    type: rename
    params:
      mapping:
        cust_id: customer_id
        Contract Length: contract_length

  # 2. Type casting
  - name: cast_types
    type: type_cast
    params:
      columns:
        - name: age
          dtype: int

        - name: income
          dtype: float

        - name: signup_date
          dtype: datetime
          format: "%Y-%m-%d"

  # 3. Missing values (column-wise strategies)
  - name: handle_missing
    type: missing
    params:
      columns:
        - name: age
          strategy: mean

        - name: income
          strategy: median

        - name: gender
          strategy: mode

        - name: country
          strategy: constant
          fill_value: "Unknown"

  # 4. Encoding
  - name: encode_features
    type: encoding
    params:
      columns:
        - name: gender
          strategy: one_hot

        - name: contract_length
          strategy: label

  # 5. Scaling
  - name: scale_features
    type: scaling
    params:
      columns:
        - name: age
          strategy: standard

        - name: income
          strategy: minmax

features:
  scaling: standard

model:
  type: logistic_regression
  hyperparameters:
    C: 1.0
    max_iter: 100


training:
  objective: binary:logistic


evaluation:
  metrics:
    - accuracy
    - f1