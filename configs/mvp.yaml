project:
  name: customer_churn_prediction
  owner: data_science_team
  environment: production
  description: Predict customer churn for telecom users

mlflow:
  experiment_name: customer_churn_experiments
  experiment_id: NA
  track_params: true
  track_metrics: true
  track_artifacts:
    - feature_config
    - preprocessing_objects
    - model

  tags:
    project: churn
    stage: production
    owner: data_science_team


dataset:
  dataset_name: telecom_churn_v1
  random_state: 52
  # test_size: .3
  
  # todo: Add train test split ratio in future if test dataset is not provided.
  train:
    type: csv
    path: data/raw/churn_train.csv
    id_column: CustomerID
    target_column: Churn
    positive_class: 1

  # test:
  #   type: csv
  #   path: data/raw/churn_test.csv
  #   id_column: CustomerID
  #   target_column: Churn
  #   positive_class: 1


preprocessing:
  # This are applied over all columns
  # Todo: Add column level processing in future
  missing_values: mean
  categorical_encoding: one_hot

features:
  scaling: standard

model:
  type: logistic_regression
  hyperparameters:
    C: 1.0
    max_iter: 100


training:
  objective: binary:logistic


evaluation:
  metrics:
    - accuracy
    - f1